<!DOCTYPE html>

<head>

  <!-- 가독성 좋은 구글 Noto Sans KR 폰트 -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 최상단 파란색 타이틀 바 -->
  <div class="window-top-bar">
    <span class="window-title">29-복잡한 SQL 질의_29분53초</span>
    <span class="window-close-btn">✕</span>
  </div>

  <!-- 2. 플레이어 영역 -->
  <div class="player-container">
    
    <!-- 비디오 상단 오버레이 바 -->
    <div class="video-header-bar">
      <div class="left-info">29-복잡한 SQL 질의_29분53초</div>
      <div class="right-info">
        <span>최종 수정일 : 2024.09.21</span>
        <span class="info-icon">ⓘ</span>
      </div>
    </div>

    <!-- 비디오 메인 스테이지 -->
    <div class="video-stage">
      
      <!-- 중앙 래퍼 -->
      <div class="center-content-wrapper">
        
        <!-- 상단 헤더 영역 (COSS 제외) -->
        <div class="header-logo-row">
          <div class="bg-header-logo">
            <div class="sub">빅데이터 혁신융합대학</div>
            <div class="main">데이터베이스</div>
          </div>
        </div>

        <!-- 하단 메인 콘텐츠 Row (PPT + 교수님 캠) -->
        <div class="main-body-row">
          <!-- 메인 PPT 슬라이드 -->
          <div class="slide-board">
            <h1 class="slide-title">모듈 29. 복잡한 SQL 질의</h1>
            <ul class="slide-content">
              <li>SQL의 FROM절에 Joined Table 명시</li>
              <li>Natural Join</li>
              <li>Inner Join vs. Outer Join</li>
              <li>WITH Clause</li>
              <li>CASE Construct</li>
            </ul>
          </div>

          <!-- 우측 교수님 카메라 & 명패 Box -->
          <div class="prof-cam-box">
            <div class="prof-video-wrapper">
              <video id="profVideo" class="prof-video" autoplay playsinline muted></video>
            </div>

            <!-- 교수님 명패 -->
            <div class="prof-nameplate">
              <div class="logo-wrapper">
                <img src="https://tse2.mm.bing.net/th/id/OIP.GnnS14QER2bQpwbUhnfVPQAAAA?r=0&pid=Api&h=220&P=0" alt="숙명여대 로고" class="sm-logo-img">
              </div>
              <div class="info-content">
                <div class="top-blue-box">
                  <span class="prof-name">황유하</span>
                  <span class="prof-role">교수</span>
                </div>
                <div class="bottom-white-box">
                  <span class="prof-dept">숙명여자대학교 인공지능공학부</span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div> <!-- /center-content-wrapper -->

    </div>

    <!-- 3. 하단 컨트롤러 & 프로그레스 바 -->
    <div class="bottom-controls-container">
      <div class="progress-bar-wrapper">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: 47.3%;">
            <div class="progress-scrubber"></div>
          </div>
        </div>
      </div>

      <div class="controls-bar">
        <div class="controls-left">
          <button class="icon-btn play-btn">▶</button>
          <button class="icon-btn sound-btn">🔊</button>
          <span class="time-display"><strong>14:05</strong> / 29:53</span>
        </div>
        <div class="controls-right">
          <button class="speed-btn">x 1.6</button>
          <button class="icon-btn fullscreen-btn">⛶</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const video = document.getElementById('profVideo');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(function (stream) {
          video.srcObject = stream;
        })
        .catch(function (error) {
          console.error("웹캠을 불러올 수 없습니다:", error);
        });
    }
  </script>
